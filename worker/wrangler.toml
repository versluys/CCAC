# Cair Paravel: the seat by the sea the four spend the whole story getting
# back to. A parish looking for a permanent home could do worse for a name.
# Deploys to cair-paravel.<your-account>.workers.dev; point a custom domain at
# it whenever the vestry is ready.
# Other Narnian options, if the committee prefers: lamp-post (the waypoint),
# spare-oom (Lucy's name for the professor's spare room), or the-wardrobe.
name = "cair-paravel"
main = "src/index.ts"
# Kept at a date the pinned wrangler's runtime actually supports. A later date
# makes wrangler fall back with a warning, so features you asked for may not be
# the ones you get. Raise this only together with the wrangler version.
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# The built React app. One Worker serves the UI and the API so that a single
# Cloudflare Access application covers both (PRD §6).
[assets]
directory = "../web/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "ccac-sitefinder"
# Replace with the id printed by:  npx wrangler d1 create ccac-sitefinder
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# The lamppost: the waypoint Lucy steers by, rather than Cair Paravel, which is
# the destination this tool only helps look for. wrangler creates the DNS record
# and the certificate on deploy, provided versluys.us is a zone on this
# Cloudflare account.
#
# Until the first deploy the Worker also answers on
# cair-paravel.<account>.workers.dev. That is fine for setting Access up, but
# the Access application must name whichever hostname the committee actually
# visits, and the AUD tag belongs to the application, not the Worker.
routes = [
  { pattern = "lamppost.versluys.us", custom_domain = true }
]

[vars]
# Not secrets: these are public identifiers for the Access application, and the
# Worker verifies every token's signature against the team's JWKS regardless.
# Zero Trust > Settings > Custom Pages shows the team domain; the AUD tag is on
# the Access application's own page.
CF_ACCESS_TEAM_DOMAIN = "REPLACE_WITH_YOUR_TEAM.cloudflareaccess.com"
CF_ACCESS_AUD = "REPLACE_WITH_YOUR_ACCESS_APPLICATION_AUD_TAG"
# A second gate behind the Access policy. With this set, a policy edited by
# mistake still cannot open the parish's research to anyone outside the domain.
# Set it to the Workspace domain, e.g. "christschapelrec.org".
ALLOWED_EMAIL_DOMAINS = ""
ENVIRONMENT = "production"

# ---------------------------------------------------------------------------
# Local development. A named wrangler environment does NOT inherit top-level
# bindings, so the assets and D1 bindings are repeated here deliberately.
#
# ACCESS_DEV_EMAIL is ignored unless ENVIRONMENT is exactly "development", so
# it cannot open a door in production. Never set ENVIRONMENT to "development"
# on a deployed Worker.
# ---------------------------------------------------------------------------
[env.dev.vars]
ENVIRONMENT = "development"
ACCESS_DEV_EMAIL = "treasurer@example.org"
CF_ACCESS_TEAM_DOMAIN = "example.cloudflareaccess.com"
CF_ACCESS_AUD = "dev-not-verified"
# Repeated because named environments do not inherit top-level vars. Empty
# locally: there is no real identity to filter in development.
ALLOWED_EMAIL_DOMAINS = ""

[env.dev.assets]
directory = "../web/dist"
binding = "ASSETS"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "ccac-sitefinder"
database_id = "local-dev"

[observability]
enabled = true
